name: Validate skill

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate skill structure
        run: python scripts/validate_skill.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
